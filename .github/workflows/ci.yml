name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://netija:ci-only-password@localhost:5432/netija_test
      REDIS_URL: redis://localhost:6379
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-only-meilisearch-key
      BETTER_AUTH_SECRET: ci-only-session-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PYTHON_BIN: python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netija
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: netija_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netija -d netija_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.11.0
        env:
          MEILI_MASTER_KEY: ci-only-meilisearch-key
          MEILI_ENV: development
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget -qO- http://localhost:7700/health"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements*.txt
      - run: npm ci
      - run: python -m pip install -r worker/requirements-dev.txt
      - run: npm run db:migrate --workspace=api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --workspace=api
      - run: npm run test --workspace=web -- --runInBand
      - run: python -m pytest
        working-directory: worker
      - run: python -m ruff check .
        working-directory: worker
      - run: npm run build
